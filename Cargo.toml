[workspace]
resolver = "3"
members = ["crates/protocol", "crates/relay-worker"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# strip = true breaks worker-build (cloudflare/workers-rs#1014)
